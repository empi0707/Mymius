appId: app.mymius.desktop
productName: Mymius
executableName: mymius
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
publish: null   # phát hành thủ công: gửi bộ cài cho nhóm, không có auto-update
directories:
  buildResources: build
  output: release
files:
  - out/**/*
# One config, three platforms. Cross-building is limited (mac targets need macOS), so CI builds each on its own OS.
mac:
  category: public.app-category.developer-tools
  target: [dmg, zip]
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Signing and notarization read APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / CSC_LINK from the environment.
win:
  target: [nsis, zip]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  category: Development
  syncDesktopName: true
  maintainer: Mymius <noreply@mymius.app>
  synopsis: SSH terminal and dual-pane file manager
  target: [AppImage, deb]
