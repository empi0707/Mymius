appId: app.mymius.desktop
productName: Mymius
executableName: mymius
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
publish: null   # phát hành thủ công: gửi bộ cài cho nhóm, không có auto-update
# node-pty (terminal local) là N-API: chạy trên mọi phiên bản Electron mà không cần rebuild; ssh2 có thêm cpu-features/sshcrypto tùy chọn và tự dùng bản JS thuần nên cũng không cần rebuild.
npmRebuild: false
directories:
  buildResources: build
  output: release
files:
  - out/**/*
# The pseudo-terminal addon (and, on macOS, its spawn-helper program) must be real files on disk, not inside app.asar.
asarUnpack:
  - "**/node_modules/node-pty/**"
# One config, three platforms. Cross-building is limited (mac targets need macOS), so CI builds each on its own OS.
mac:
  category: public.app-category.developer-tools
  target: [dmg, zip]
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Signing and notarization read APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / CSC_LINK from the environment.
win:
  target: [nsis, zip]
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  category: Development
  syncDesktopName: true
  maintainer: Mymius <noreply@mymius.app>
  synopsis: SSH terminal and dual-pane file manager
  target: [AppImage, deb]
